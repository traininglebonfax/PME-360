[project]
name = "pme360-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# SQL des vues analytiques : constantes internes, aucune donnée utilisateur interpolée.
"pme360/analytics/sql.py" = ["S608"]
"tests/**" = ["S105", "S106"]
"pme360/core/management/commands/seed_demo.py" = ["S105", "S106"]
"pme360/diagnostic/gude360_v1.py" = ["E501"]  # contenu du référentiel : textes des questions et ancres
"pme360/compliance/defaults.py" = ["E501"]  # données : textes, sources et messages
"seeds/ai_eval_dataset.py" = ["E501", "S311"]  # documents fictifs générés (hasard non cryptographique voulu)
