# PME360 — environnement de développement.
# Ports décalés pour cohabiter avec d'autres projets locaux (cf. infra/README.md).
name: pme360

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres-dev-only}
      POSTGRES_DB: postgres
      # Rôle applicatif NON superutilisateur : la Row-Level Security ne s'applique pas aux superutilisateurs.
      PME360_DB_NAME: ${POSTGRES_DB:-pme360}
      PME360_DB_USER: ${POSTGRES_USER:-pme360}
      PME360_DB_PASSWORD: ${POSTGRES_PASSWORD:-pme360-dev-only}
    ports:
      - "${PME360_PG_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${PME360_REDIS_PORT:-6390}:6379"

  mailpit:
    # Capture des e-mails (OTP, invitations) en développement : http://localhost:8035
    image: axllent/mailpit:latest
    ports:
      - "${PME360_MAIL_UI_PORT:-8035}:8025"
      - "${PME360_SMTP_PORT:-1035}:1025"

  backend:
    build:
      context: ../backend
    profiles: ["app"]
    env_file: ../backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PME360_API_PORT:-8010}:8000"

  worker:
    build:
      context: ../backend
    profiles: ["app"]
    command: celery -A config worker -l info
    env_file: ../backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
