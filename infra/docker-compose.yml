# PME360 — environnement de développement.
# Ports décalés pour cohabiter avec d'autres projets locaux (cf. infra/README.md).
name: pme360

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres-dev-only}
      POSTGRES_DB: postgres
      # Rôle applicatif NON superutilisateur : la Row-Level Security ne s'applique pas aux superutilisateurs.
      PME360_DB_NAME: ${POSTGRES_DB:-pme360}
      PME360_DB_USER: ${POSTGRES_USER:-pme360}
      PME360_DB_PASSWORD: ${POSTGRES_PASSWORD:-pme360-dev-only}
    ports:
      - "${PME360_PG_PORT:-5442}:5432"
    # Archivage continu des WAL vers le volume de sauvegarde (restauration à un instant donné, RPO 15 min).
    entrypoint: ["bash", "/scripts/postgres-entrypoint.sh"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./backup:/scripts:ro
      - pgbackups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${PME360_REDIS_PORT:-6390}:6379"

  minio:
    # Stockage objet compatible S3 (documents des PME). Console : http://localhost:9011
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PME360_MINIO_USER:-pme360}
      MINIO_ROOT_PASSWORD: ${PME360_MINIO_PASSWORD:-pme360-dev-only}
    ports:
      - "${PME360_MINIO_PORT:-9010}:9000"
      - "${PME360_MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - miniodata:/data

  clamav:
    # Antivirus (≈ 1,5 Go de mémoire) : optionnel en développement, OBLIGATOIRE en production.
    # docker compose --profile antivirus up -d clamav
    image: clamav/clamav:stable
    profiles: ["antivirus"]
    ports:
      - "${PME360_CLAMD_PORT:-3310}:3310"

  backup:
    # Sauvegardes : quotidienne chiffrée, base hebdomadaire, test de restauration mensuel (infra/backup/README.md).
    # docker compose --profile backup up -d
    image: pgvector/pgvector:pg16
    profiles: ["backup"]
    entrypoint: ["bash", "/scripts/scheduler.sh"]
    environment:
      PME360_ENV: ${PME360_ENV:-dev}
      PME360_BACKUP_DB_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres-dev-only}
      PME360_BACKUP_PASSPHRASE: ${PME360_BACKUP_PASSPHRASE:-backup-dev-only}
      PME360_BACKUP_HOUR_UTC: ${PME360_BACKUP_HOUR_UTC:-1}
    volumes:
      - ./backup:/scripts:ro
      - pgbackups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  backup-objects:
    # Réplication continue du stockage des documents et rapports (MinIO en local, S3 en production).
    image: minio/mc:latest
    profiles: ["backup"]
    environment:
      MC_HOST_local: http://${PME360_MINIO_USER:-pme360}:${PME360_MINIO_PASSWORD:-pme360-dev-only}@minio:9000
    command: ["mirror", "--watch", "--overwrite", "local/${PME360_S3_BUCKET:-pme360-documents}", "/backups/objects"]
    volumes:
      - pgbackups:/backups
    depends_on:
      - minio

  mailpit:
    # Capture des e-mails (OTP, invitations) en développement : http://localhost:8035
    image: axllent/mailpit:latest
    ports:
      - "${PME360_MAIL_UI_PORT:-8035}:8025"
      - "${PME360_SMTP_PORT:-1035}:1025"

  backend:
    build:
      context: ../backend
    profiles: ["app"]
    env_file: ../backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PME360_API_PORT:-8010}:8000"

  worker:
    build:
      context: ../backend
    profiles: ["app"]
    command: celery -A config worker -l info
    env_file: ../backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  pgbackups:
