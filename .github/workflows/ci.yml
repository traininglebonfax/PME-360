name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pme360
      POSTGRES_USER: pme360
      POSTGRES_PASSWORD: pme360-ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Rôle applicatif sans privilèges (la RLS ne s'applique pas aux superutilisateurs)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE pme360 LOGIN PASSWORD 'pme360-ci' NOSUPERUSER NOBYPASSRLS CREATEDB;"
          psql -h localhost -U postgres -c "CREATE DATABASE pme360 OWNER pme360;"
          for db in template1 pme360; do
            psql -h localhost -U postgres -d $db -c "CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS citext;"
          done
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - name: Contrat OpenAPI à jour (frontend/openapi.json)
        run: python manage.py spectacular --format openapi-json --file ../frontend/openapi.json && git diff --exit-code ../frontend/openapi.json
      - run: pytest
      - name: Couverture du moteur de scoring (critère de sortie de la phase 2 : ≥ 90 %)
        run: pytest tests/test_scoring_engine.py --cov=pme360.scoring.engine --cov=pme360.core.jsonlogic --cov=pme360.core.expressions --cov-fail-under=90
      - name: Audit des dépendances
        run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Contrat OpenAPI à jour (types générés depuis openapi.json)
        run: npm run api:types && git diff --exit-code lib/api-schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
